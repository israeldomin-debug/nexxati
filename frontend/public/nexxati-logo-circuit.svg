      .node { stroke: #13203f; stroke-width: 4; filter: url(#soft-glow); }
      .word { font-family: Inter, Segoe UI, Arial, sans-serif; font-weight: 950; letter-spacing: 7px; }
      .sub { font-family: Inter, Segoe UI, Arial, sans-serif; font-weight: 800; letter-spacing: 13px; }
