<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-label="NEXXATI Software Solutions">
  <defs>
    <linearGradient id="circuit-cyan" x1="120" y1="80" x2="280" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23f6df"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="circuit-amber" x1="320" y1="80" x2="505" y2="225" gradientUnits="userSpaceOnUse">
