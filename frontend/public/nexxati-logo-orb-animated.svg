<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" role="img" aria-label="NEXXATI Ativos e Chamados">
  <defs>
    <style>
      .pulse-ring { animation: ring-pulse 3.6s ease-in-out infinite; transform-origin: 310px 88px; }
      .scan { animation: scan-move 2.8s ease-in-out infinite; }
      .node-a { animation: node-glow 2.3s ease-in-out infinite; }
      .node-b { animation: node-glow 2.3s ease-in-out infinite .55s; }
      .node-c { animation: node-glow 2.3s ease-in-out infinite 1.1s; }
      .title { animation: title-glow 3.2s ease-in-out infinite; }
      @keyframes ring-pulse {
        0%, 100% { opacity: .38; transform: scale(.96); }
        50% { opacity: .9; transform: scale(1.05); }
      }
      @keyframes scan-move {
        0%, 100% { transform: translateX(-34px); opacity: .22; }
        50% { transform: translateX(34px); opacity: .82; }
      }
      @keyframes node-glow {
        0%, 100% { opacity: .48; }
        50% { opacity: 1; }
      }
      @keyframes title-glow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(56,189,248,.2)); }
        50% { filter: drop-shadow(0 0 14px rgba(34,211,238,.52)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-ring, .scan, .node-a, .node-b, .node-c, .title { animation: none; }
      }
    </style>
    <linearGradient id="markBg" x1="230" y1="18" x2="390" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071527"/>
      <stop offset="0.56" stop-color="#0d2b66"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="lineA" x1="258" y1="50" x2="370" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.46" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="lineB" x1="366" y1="42" x2="252" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="262" y1="24" x2="334" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="190" y="-8" width="240" height="230" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <circle class="pulse-ring" cx="310" cy="88" r="78" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="18 14"/>
    <circle class="pulse-ring" cx="310" cy="88" r="92" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 12" opacity="0.72"/>
    <rect x="230" y="20" width="160" height="160" rx="42" fill="url(#markBg)"/>
    <path d="M264 132V66c0-11 7-18 18-18h9l65 84V50" fill="none" stroke="url(#lineB)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M264 132h28l64-82h-27" fill="none" stroke="url(#lineA)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="scan" d="M278 34h20l-40 112h-20z" fill="url(#scanGradient)" opacity="0.55"/>
    <path d="M214 88h-28M406 88h28M310 180v30M310-10v30" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle class="node-a" cx="186" cy="88" r="7" fill="#22d3ee"/>
    <circle class="node-b" cx="434" cy="88" r="7" fill="#60a5fa"/>
    <circle class="node-c" cx="310" cy="210" r="7" fill="#38bdf8"/>
    <path d="M358 48l22-22h28" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M262 150l-22 22h-28" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="title" x="310" y="226" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="950" letter-spacing="3">NEXXATI</text>
  <text x="310" y="254" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="850" letter-spacing="8">ATIVOS E CHAMADOS</text>
</svg>
