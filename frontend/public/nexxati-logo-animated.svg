<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="NEXXATI animado">
  <defs>
    <linearGradient id="bg" x1="18" y1="18" x2="136" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".48" stop-color="#0b4aa2"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="letter" x1="38" y1="34" x2="112" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8ee7ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="-180" y1="0" x2="-40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.74 0 0 0 0 1 0 0 0 .85 0" result="color"/>
      <feMerge>
        <feMergeNode in="color"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="markClip">
      <rect x="18" y="20" width="118" height="118" rx="34"/>
    </clipPath>
    <clipPath id="wordClip">
      <text x="166" y="91" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="8">NEXXATI</text>
    </clipPath>
    <style>
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 77px 80px; }
      .scan { animation: scan 3.6s ease-in-out infinite; }
      .line { animation: lineGlow 2.8s ease-in-out infinite; }
      .spark { animation: spark 2.2s ease-in-out infinite; transform-origin: 121px 41px; }
      @keyframes pulse {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(56,189,248,.25)); }
        50% { filter: drop-shadow(0 0 18px rgba(56,189,248,.95)); }
      }
      @keyframes scan {
        0% { transform: translateX(0); opacity: 0; }
        16% { opacity: .9; }
        58% { opacity: .9; }
        78%, 100% { transform: translateX(710px); opacity: 0; }
      }
      @keyframes lineGlow {
        0%, 100% { stroke-opacity: .55; }
        50% { stroke-opacity: 1; }
      }
      @keyframes spark {
        0%, 100% { transform: scale(1); opacity: .78; }
        50% { transform: scale(1.18); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .scan, .line, .spark { animation: none; }
      }
    </style>
  </defs>
  <g class="pulse">
    <rect x="18" y="20" width="118" height="118" rx="34" fill="url(#bg)"/>
    <path d="M45 105V52h16l42 43V52h15v53h-16L60 62v43H45Z" fill="url(#letter)"/>
    <path class="line" d="M42 118h70" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <path class="spark" d="M121 31l10 10-10 10-10-10 10-10Z" fill="#fff"/>
  </g>
  <g clip-path="url(#markClip)">
    <rect class="scan" x="-180" y="20" width="140" height="118" fill="url(#shine)" transform="skewX(-18)"/>
  </g>
  <text x="166" y="91" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="8">NEXXATI</text>
  <g clip-path="url(#wordClip)">
    <rect class="scan" x="-180" y="38" width="140" height="70" fill="url(#shine)" transform="skewX(-18)"/>
  </g>
  <text x="171" y="121" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="4">SOFTWARE SOLUTIONS</text>
  <path class="line" d="M171 132h190" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity=".8"/>
</svg>
