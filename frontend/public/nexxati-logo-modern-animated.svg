<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 112" role="img" aria-labelledby="title desc">
  <title id="title">NEXXATI</title>
  <desc id="desc">Ativos e chamados. Símbolo N com iluminação suave sobre fundo transparente.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5b4fc"/><stop offset="1" stop-color="#5278ff"/></linearGradient>
    <linearGradient id="light"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="mark"><path d="M8 80V8h18l40 46V8h22v72H70L30 34v46Z"/></clipPath>
  </defs>
  <style>
    .symbol { animation: float 3s ease-in-out infinite; }
    .shine { animation: shine 3s ease-in-out infinite; }
    .corner { animation: glow 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes shine { 0% { transform: translateX(-40px); opacity:0; } 15%,65% { opacity:1; } 100% { transform: translateX(120px); opacity:0; } }
    @keyframes glow { 0%,100% { opacity:.75; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .symbol,.shine,.corner { animation:none; } .shine { display:none; } }
  </style>
  <g transform="translate(8 12)"><g class="symbol">
    <path d="M8 80V8h18l40 46V8h22v72H70L30 34v46Z" fill="url(#blue)"/>
    <g clip-path="url(#mark)"><rect class="shine" x="-20" y="0" width="40" height="88" fill="url(#light)"/></g>
    <path class="corner" d="M70 8h18v18Z" fill="#4de0cf"/>
  </g></g>
  <text x="128" y="67" font-family="Segoe UI,Arial,sans-serif" font-size="49" font-weight="700" letter-spacing="1" fill="#f1f5ff">NEXXATI</text>
  <text x="131" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#a4b5d1">ATIVOS E CHAMADOS</text>
</svg>
